<!DOCTYPE html>

  <title>Fotos — Los Pat Moritas</title>
  <link rel="stylesheet" href="../css/style.css?v=2">
  <style>
    .gb-label { font-size:.72rem; color:#333; letter-spacing:.14em;
                 text-transform:uppercase; margin-bottom:.5rem; }
    .albums { display:grid;
               grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
               gap:1.5rem; margin-top:2rem; }
    .album-card { display:block; text-decoration:none;
                   border:1px solid #1a1a1a; transition:border-color .2s; }
    .album-card:hover { border-color:var(--cyan); }
    .album-card img { width:100%; aspect-ratio:128/112; object-fit:cover;
                       display:block; image-rendering:pixelated; }
    .album-info { padding:.8rem 1rem; border-top:1px solid #111; }
    .album-date { font-size:.72rem; color:var(--cyan); letter-spacing:.14em;
                   text-transform:uppercase; margin-bottom:.3rem; }
    .album-title { font-size:.9rem; color:var(--white); letter-spacing:.05em; }
    .album-count { font-size:.72rem; color:#444; margin-top:.3rem;
                    letter-spacing:.1em; }
  </style>
</head>

  <section class="page-section">
    <p class="gb-label">Game Boy Camera</p>
    <h2>Fotos</h2>
    <div class="albums">
      <a class="album-card" href="260913-planetwax/index.html">
        <img src="260913-planetwax/IMG_PC02.png" alt="PlanetWax">
        <div class="album-info">
          <p class="album-date">13 de septiembre de 2026</p>
          <p class="album-title">PlanetWax</p>
          <p class="album-count">12 fotos</p>
        </div>
      </a>
      <a class="album-card" href="260716-emf-camp/index.html">
